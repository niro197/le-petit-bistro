<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bloc de prix lisible avec offre recommandée et appels à l’action.">
  <meta name="category" content="Tarification">
  <title>Pricing Table</title>
  <link rel="stylesheet" href="component.css">
</head>
<body>
  <section class="pricing">
    <p class="kicker">SIMPLE / CLEAR / FAIR</p>
    <h1>Choose your pace.</h1>
    <div class="plans">
    <article data-component="pricing-table">
    <span>Starter</span>
    <strong>$28</strong>
    <p>For a focused launch.</p>
    <button>Choose plan</button>
    </article>
    <article class="featured">
    <span>Recommended</span>
    <strong>$48</strong>
    <p>For a growing system.</p>
    <button>Choose plan</button>
    </article>
    </div>
    </section>
</body>
</html>
